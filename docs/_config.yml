# GitHub Pages site (issue #37). Pages builds this folder with Jekyll: Settings → Pages → Deploy from a branch,
# main, /docs. Only index.html, support.md, assets/ and guide/ are the site; everything else in docs/ is project documentation and is
# excluded, also because some of it holds `{{ }}` text that Jekyll would try to run as Liquid.
title: StationBreak
description: Live TV channels built from your own Jellyfin library, for Fire TV.
defaults:
  - scope:
      path: ""
    values:
      layout: default
exclude:
  - adr
  - beta
  - compatibility
  - design
  - dogfood
  - gates
  - legal
  - rules-format
  - specs
  - store
  - superpowers
  - testing
  - ASSUMPTIONS.md
  - BACKLOG.md
  - EPICS.md
  - MODULES.md
  - ROADMAP.md
  - SPEC.md
  - rules-format.md
