<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1C1B19">
  {% seo %}
  <link rel="icon" href="{{ '/assets/icon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preload" href="{{ '/assets/fonts/manrope-400.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/ranchers.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body class="{{ page.body_class }}">
  <a class="skip" href="#content">Skip to the content</a>
  <header class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/icon.svg' | relative_url }}" alt="" width="36" height="36">
      <span class="wordmark">Station Break</span>
    </a>
    <nav aria-label="Main">
      <a href="{{ '/guide/' | relative_url }}">Guide</a>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/support/' | relative_url }}">Support</a>
    </nav>
  </header>
  <main id="content" class="{% unless page.body_class == 'landing' %}doc{% endunless %}">
    {{ content }}
  </main>
  <footer class="foot">
    <p class="flag">Free and open source</p>
    <p>
      <a href="mailto:support@stationbreak.tv">support@stationbreak.tv</a> ·
      <a href="{{ '/guide/' | relative_url }}">Guide</a> ·
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a> ·
      <a href="{{ '/support/' | relative_url }}">Support</a> ·
      <a href="https://github.com/StationBreak/stationbreaktv">GitHub</a>
    </p>
    <p class="small">StationBreak is released under the GNU GPL. It plays only your own media from your own Jellyfin server.</p>
  </footer>
</body>
</html>
