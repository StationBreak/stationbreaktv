name: Release

# Tagged releases, built and signed by CI (ADR-0011, S4.1.1, #98, #276). Only a pushed `vX.Y.Z` tag starts it: never
# pull_request or pull_request_target, never workflow_dispatch, so a fork can't reach the release key.
# Two jobs. `build` runs the repository's code (Gradle) and holds no secret. `sign` holds the release key and runs no
# repository code: no checkout, no Gradle, no cache. The result is a DRAFT GitHub release; the owner publishes it by
# hand, and nothing is uploaded to a store.
on:
  push:
    tags: ["v*"]

# Nothing by default: each job asks for what it needs.
permissions: {}

# One release run per tag; a second push of the same tag name waits rather than racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No environment, no secret. Fails before anything is built unless the tag is a clean SemVer on a commit that is on
  # main. No cache is restored or saved: a release build starts clean and leaves nothing for another run to pick up.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # MAJOR 1 or more, MINOR and PATCH 0 to 99, no leading zeros: versionCode is MAJOR*10000 + MINOR*100 + PATCH.
          # The same pattern is ReleaseVersion's in build-logic: change both together.
          if ! [[ "$TAG" =~ ^v([1-9][0-9]*\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?))$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH (MAJOR 1 or more, MINOR and PATCH 0 to 99)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release comes only from main's history, whoever pushed the tag.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Unsigned: Gradle has no release signing config and never sees a key.
      - name: Assemble the release APKs
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: ./gradlew assembleGithubRelease assembleAmazonRelease

      - name: Collect the unsigned APKs
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          mkdir -p dist
          for flavor in github amazon; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::$apk was not built"
              exit 1
            fi
            cp "$apk" "dist/stationbreak-$flavor-v$VERSION.apk"
          done
          ls -l dist

      # Handed to `sign`. Kept a day: only that job reads it.
      - name: Upload the unsigned APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-release-apks-unsigned
          path: dist/
          retention-days: 1
          if-no-files-found: error

  # The only job that sees the release key. It runs in the `release` environment, which has a required reviewer: the
  # run waits for the owner's approval, and the secrets exist only after it. No checkout, no Gradle, no cache: nothing
  # from the repository runs where the key is. The write permissions are on this job alone.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      # The draft release.
      contents: write
      # The signing identity for the attestation.
      id-token: write
      attestations: write
    env:
      # The runner image's build-tools, as in ci.yml (AGP 9.4's default version).
      BUILD_TOOLS_VERSION: 36.0.0
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Outside the workspace, so the input can't be confused with the output.
      - name: Download the unsigned APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-release-apks-unsigned
          path: ${{ runner.temp }}/in

      # The key file lives in the runner's temp directory, never the workspace, and is removed by the step after this
      # one whatever happens (and by this step's own trap). Secrets reach this step through its environment only.
      - name: Sign the APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # A tag never publishes an unsigned release: any missing secret stops the run here.
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::release secrets missing or empty in the release environment (ADR-0011):$missing"
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          for tool in apksigner zipalign aapt2; do
            if [ ! -x "$BUILD_TOOLS/$tool" ]; then
              echo "::error::build-tools $BUILD_TOOLS_VERSION ($tool) is not on the runner image"
              exit 1
            fi
          done
          store="$RUNNER_TEMP/release-keystore"
          trap 'rm -f "$store"' EXIT
          (umask 077 && base64 -d <<<"$RELEASE_KEYSTORE_BASE64" > "$store")
          mkdir -p "$RUNNER_TEMP/aligned" "$RUNNER_TEMP/out"
          for apk in "$RUNNER_TEMP"/in/stationbreak-*.apk; do
            name="$(basename "$apk")"
            # AGP aligns its output; aligning again is harmless and apksigner needs it done before signing.
            "$BUILD_TOOLS/zipalign" -f -P 16 4 "$apk" "$RUNNER_TEMP/aligned/$name"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$store" --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$RUNNER_TEMP/out/$name" "$RUNNER_TEMP/aligned/$name"
          done

      - name: Delete the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore"

      # Fails the release, before anything is published: not debuggable, the version from the tag, signed by one
      # certificate that is neither debug certificate (ADR-0011 item 2; #98, #276).
      - name: Verify the signed APKs
        id: verify
        env:
          # The two debug certificates a release must never carry (ADR-0011): the CI debug key (in the DEBUG_KEYSTORE_*
          # secrets since 2026-10-18; #276) and the retired, once-public debug.keystore (still in the git history,
          # alias androiddebugkey). They are public values. This is the one place they are listed.
          DEBUG_CERT_SHA256S: >-
            00:47:8A:2B:61:D1:ED:A5:77:93:77:13:57:0A:AB:17:9E:55:FD:C2:85:F8:4E:D2:28:3E:15:B7:E4:21:65:22
            57:4B:E8:75:93:09:FF:2E:AE:16:57:9B:89:55:4D:84:E8:7B:2B:4E:96:D7:FF:82:D1:51:CC:59:19:BA:80:B1
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          IFS=. read -r major minor patch <<<"$VERSION"
          expected_code=$((major * 10000 + minor * 100 + patch))
          # One per line, as apksigner prints digests: lower-case hex, no colons.
          debug_certs="$(xargs -n1 <<<"$DEBUG_CERT_SHA256S" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$(wc -l <<<"$debug_certs")" -ne 2 ]; then
            echo "::error::DEBUG_CERT_SHA256S must list the two debug certificates (ADR-0011)"
            exit 1
          fi
          cert=""
          for flavor in github amazon; do
            apk="$RUNNER_TEMP/out/stationbreak-$flavor-v$VERSION.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::$apk is missing"
              exit 1
            fi
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            echo "::group::aapt2 dump badging ($flavor)"
            grep -E '^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)' <<<"$badging"
            echo "::endgroup::"
            if ! grep -q "^package: name='tv\.stationbreak\.app' versionCode='$expected_code' versionName='$VERSION' " <<<"$badging"; then
              echo "::error::$flavor APK is not tv.stationbreak.app $VERSION (versionCode $expected_code)"
              exit 1
            fi
            if grep -q '^application-debuggable' <<<"$badging"; then
              echo "::error::$flavor release APK is debuggable (ADR-0011)"
              exit 1
            fi
            certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            echo "::group::apksigner verify --print-certs ($flavor)"
            echo "$certs"
            echo "::endgroup::"
            signers="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<<"$certs" | sort -u)"
            if [ -z "$signers" ] || [ "$(wc -l <<<"$signers")" -ne 1 ]; then
              echo "::error::$flavor APK must have exactly one signer certificate"
              exit 1
            fi
            if grep -qxF "$signers" <<<"$debug_certs"; then
              echo "::error::$flavor APK is signed with a debug certificate (ADR-0011, #276)"
              exit 1
            fi
            # Both flavors are signed with the one release key.
            if [ -n "$cert" ] && [ "$cert" != "$signers" ]; then
              echo "::error::the two APKs carry different signer certificates"
              exit 1
            fi
            cert="$signers"
          done
          (cd "$RUNNER_TEMP/out" && sha256sum -- stationbreak-*.apk > SHA256SUMS && cat SHA256SUMS)
          echo "cert-sha256=$cert" >> "$GITHUB_OUTPUT"

      # Provenance for both APKs: they were built by this workflow, from this tag's commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/out/*.apk

      # A draft: the owner reads it, then publishes it. `--verify-tag` refuses to create a tag from this call. There is
      # no checkout, so the repository is passed explicitly.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CERT_SHA256: ${{ steps.verify.outputs.cert-sha256 }}
        run: |
          cd "$RUNNER_TEMP/out"
          {
            echo "StationBreak $VERSION. Draft: check the files below, then publish."
            echo
            echo "Signing certificate SHA-256 (both APKs):"
            echo
            echo "\`$CERT_SHA256\`"
            echo
            echo "APK SHA-256 (also in the attached SHA256SUMS):"
            echo
            echo '```'
            cat SHA256SUMS
            echo '```'
            echo
            echo "Each APK has a build-provenance attestation: \`gh attestation verify <apk> --repo $GITHUB_REPOSITORY\`."
            echo "Check the certificate with \`apksigner verify --print-certs <apk>\`."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" stationbreak-*.apk SHA256SUMS
