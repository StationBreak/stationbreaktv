name: Release

# Tagged releases, built and signed by CI (ADR-0011, S4.1.1, #98, #276). Only a pushed `vX.Y.Z`, `vX.Y.Z-alpha.N`, `vX.Y.Z-beta.N` or `vX.Y.Z-rc.N` tag starts it: never
# pull_request or pull_request_target, never workflow_dispatch, so a fork can't reach the release key.
# Three jobs. `build` runs the repository's code (Gradle) and holds no secret. `sign` holds the release key and runs no
# repository code: no checkout, no Gradle, no cache. `publish` holds no key and no checkout: it alone has the write
# permissions. The result is a DRAFT GitHub release; the owner publishes it by hand, and nothing goes to a store.
#
# REQUIRED repository settings (ADR-0011): this workflow runs from the tagged commit, so its own on-main check is not a
# gate by itself. The real gates are a tag ruleset for `v*` that only the owner can create, update or delete, a
# deployment policy on the `release` environment limited to tags `v*`, and the four RELEASE_* secrets (plus the
# RELEASE_CERT_SHA256 variable) kept as ENVIRONMENT secrets of `release`, never repository secrets.
on:
  push:
    tags: ["v*"]

# Nothing by default: each job asks for what it needs.
permissions: {}

# One release run per tag; a second push of the same tag name waits rather than racing the first.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # No environment, no secret. Fails before anything is built unless the tag is a clean SemVer on a commit that is on
  # main. No cache is restored or saved: a release build starts clean and leaves nothing for another run to pick up.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      version: ${{ steps.tag.outputs.version }}
      # The unsigned APKs' hashes: `sign` checks what it downloads against these before it touches the key.
      github-sha256: ${{ steps.collect.outputs.github-sha256 }}
      amazon-sha256: ${{ steps.collect.outputs.amazon-sha256 }}
      # The release notes file's hash: `publish` checks what it downloads against it.
      notes-sha256: ${{ steps.notes.outputs.notes-sha256 }}
    steps:
      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # MAJOR 0 or more, MINOR and PATCH 0 to 99, no leading zeros, optionally -alpha.N, -beta.N or -rc.N (N 0 to 29). The
          # versionCode is (MAJOR*10000 + MINOR*100 + PATCH)*100 + a stage (see expected_code below), so a pre-release
          # sorts below its final release. The same pattern is ReleaseVersion's in build-logic, and release-notes.sh
          # checks its tag argument with it too: change all three together.
          if ! [[ "$TAG" =~ ^v((0|[1-9][0-9]*)\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)(-(alpha|beta|rc)\.(0|[1-9]|[12][0-9]))?)$ ]]; then
            echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH, optionally with -alpha.N, -beta.N or -rc.N (MINOR and PATCH 0 to 99, N 0 to 29)"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      # Fails before anything is built if a release already exists for this tag. This job only has `contents: read`, and
      # GitHub shows draft releases only to a token with write access, so a draft is not seen here: `publish`, which has
      # write access, still refuses to create a second release for the tag (`gh release create` fails on an existing one).
      - name: Check no release exists for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          found="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .html_url')"
          if [ -n "$found" ]; then
            echo "::error::a release already exists for tag $TAG: $found"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A release comes only from main's history, whoever pushed the tag.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      # Release notes from the Conventional Commits since the previous v* tag (scripts/release-notes.sh). Commit text is
      # untrusted: it is only written to a Markdown file, which `publish` puts in the draft's body for the owner to edit.
      # A file in its own artifact rather than a job output, because the notes can be long.
      - name: Generate the release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir -p "$RUNNER_TEMP/notes"
          # The range ends at the commit that is built, whatever the tag name resolves to now. The notes are deliberately
          # not printed to the log: commit text is untrusted, and a log line can carry a workflow command.
          bash scripts/release-notes.sh "$TAG" "$GITHUB_SHA" > "$RUNNER_TEMP/notes/release-notes.md"
          echo "notes-sha256=$(sha256sum "$RUNNER_TEMP/notes/release-notes.md" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload the release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-release-notes
          path: ${{ runner.temp }}/notes/release-notes.md
          retention-days: 7
          if-no-files-found: error

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Unsigned: Gradle has no release signing config and never sees a key.
      - name: Assemble the release APKs
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.version }}
        run: ./gradlew assembleGithubRelease assembleAmazonRelease

      - name: Collect the unsigned APKs
        id: collect
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # Start empty: dist holds exactly the two APKs below and nothing else.
          rm -rf dist
          mkdir dist
          for flavor in github amazon; do
            apk="app/build/outputs/apk/$flavor/release/app-$flavor-release-unsigned.apk"
            if [ ! -f "$apk" ]; then
              echo "::error::$apk was not built"
              exit 1
            fi
            cp "$apk" "dist/stationbreak-$flavor-v$VERSION.apk"
          done
          ls -l dist
          {
            echo "github-sha256=$(sha256sum "dist/stationbreak-github-v$VERSION.apk" | cut -d' ' -f1)"
            echo "amazon-sha256=$(sha256sum "dist/stationbreak-amazon-v$VERSION.apk" | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

      # Handed to `sign`. Kept 7 days: `sign` waits for the owner's approval, which can outlast a day, and a re-run needs it.
      - name: Upload the unsigned APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-release-apks-unsigned
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # The only job that sees the release key. It runs in the `release` environment, which has a required reviewer: the
  # run waits for the owner's approval, and the secrets exist only after it. No checkout, no Gradle, no cache: nothing
  # from the repository runs where the key is. It needs no token permission at all.
  sign:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions: {}
    outputs:
      cert-sha256: ${{ steps.verify.outputs.cert-sha256 }}
      # The signed APKs' hashes: `publish` checks what it downloads against these and writes SHA256SUMS from them.
      github-sha256: ${{ steps.verify.outputs.github-sha256 }}
      amazon-sha256: ${{ steps.verify.outputs.amazon-sha256 }}
    env:
      # The runner image's build-tools, as in ci.yml (AGP 9.4's default version).
      BUILD_TOOLS_VERSION: 36.0.0
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # Outside the workspace, so the input can't be confused with the output.
      - name: Download the unsigned APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-release-apks-unsigned
          path: ${{ runner.temp }}/in

      # Before any key exists on this runner: the artifact store is not trusted, so what was downloaded must be what the
      # build job hashed. The outputs must be real SHA-256 values (a masked output would be empty). No secrets here.
      - name: Check the unsigned APKs against the build's hashes
        env:
          GITHUB_SHA256: ${{ needs.build.outputs.github-sha256 }}
          AMAZON_SHA256: ${{ needs.build.outputs.amazon-sha256 }}
        run: |
          for value in "$GITHUB_SHA256" "$AMAZON_SHA256"; do
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::a hash output from the build job is empty or not a SHA-256"
              exit 1
            fi
          done
          found="$(cd "$RUNNER_TEMP/in" && find . -mindepth 1 | sort | tr '\n' ' ')"
          if [ "$found" != "./stationbreak-amazon-v$VERSION.apk ./stationbreak-github-v$VERSION.apk " ]; then
            echo "::error::the unsigned artifact must hold exactly the two release APKs; found: $found"
            exit 1
          fi
          cd "$RUNNER_TEMP/in"
          printf '%s  %s\n' "$GITHUB_SHA256" "stationbreak-github-v$VERSION.apk" \
            "$AMAZON_SHA256" "stationbreak-amazon-v$VERSION.apk" > "$RUNNER_TEMP/unsigned.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/unsigned.sha256"

      # The key file lives in the runner's temp directory, never the workspace, and is removed by the step after this
      # one whatever happens (and by this step's own trap). Secrets reach this step through its environment only.
      - name: Sign the APKs
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          # A tag never publishes an unsigned release: any missing secret stops the run here.
          missing=""
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::release secrets missing or empty in the release environment (ADR-0011):$missing"
            exit 1
          fi
          # Exactly the two APKs the build job names, and nothing else: an extra file is never signed.
          found="$(cd "$RUNNER_TEMP/in" && find . -mindepth 1 | sort | tr '\n' ' ')"
          if [ "$found" != "./stationbreak-amazon-v$VERSION.apk ./stationbreak-github-v$VERSION.apk " ]; then
            echo "::error::the unsigned artifact must hold exactly the two release APKs; found: $found"
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          for tool in apksigner zipalign aapt2; do
            if [ ! -x "$BUILD_TOOLS/$tool" ]; then
              echo "::error::build-tools $BUILD_TOOLS_VERSION ($tool) is not on the runner image"
              exit 1
            fi
          done
          store="$RUNNER_TEMP/release-keystore"
          trap 'rm -f "$store"' EXIT
          (umask 077 && base64 -d <<<"$RELEASE_KEYSTORE_BASE64" > "$store")
          mkdir -p "$RUNNER_TEMP/aligned" "$RUNNER_TEMP/out"
          for name in "stationbreak-github-v$VERSION.apk" "stationbreak-amazon-v$VERSION.apk"; do
            # AGP aligns its output; aligning again is harmless and apksigner needs it done before signing.
            "$BUILD_TOOLS/zipalign" -f -P 16 4 "$RUNNER_TEMP/in/$name" "$RUNNER_TEMP/aligned/$name"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$store" --ks-key-alias "$RELEASE_KEY_ALIAS" \
              --ks-pass env:RELEASE_KEYSTORE_PASSWORD --key-pass env:RELEASE_KEY_PASSWORD \
              --v4-signing-enabled false \
              --out "$RUNNER_TEMP/out/$name" "$RUNNER_TEMP/aligned/$name"
          done

      - name: Delete the release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release-keystore"

      # Fails the release, before anything is published: not debuggable, the version from the tag, signed by one
      # certificate that is the pinned release certificate and neither debug certificate (ADR-0011 item 2; #98, #276).
      - name: Verify the signed APKs
        id: verify
        env:
          # The release certificate's SHA-256: an environment variable of `release` (not a secret; it is public), set by
          # the owner from the keystore before the first tag (ADR-0011).
          RELEASE_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
          # The two debug certificates a release must never carry (ADR-0011): the CI debug key (in the DEBUG_KEYSTORE_*
          # secrets since 2026-10-18; #276) and the retired, once-public debug.keystore (still in the git history,
          # alias androiddebugkey). They are public values. This is the one place they are listed.
          DEBUG_CERT_SHA256S: >-
            00:47:8A:2B:61:D1:ED:A5:77:93:77:13:57:0A:AB:17:9E:55:FD:C2:85:F8:4E:D2:28:3E:15:B7:E4:21:65:22
            57:4B:E8:75:93:09:FF:2E:AE:16:57:9B:89:55:4D:84:E8:7B:2B:4E:96:D7:FF:82:D1:51:CC:59:19:BA:80:B1
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          # ReleaseVersion's versionCode (build-logic): the stage is 99 for a final, N for -alpha.N, 30 + N for -beta.N and 60 + N for -rc.N.
          [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta|rc)\.([0-9]+))?$ ]]
          stage=99
          if [ "${BASH_REMATCH[5]}" = alpha ]; then stage=$((BASH_REMATCH[6])); fi
          if [ "${BASH_REMATCH[5]}" = beta ]; then stage=$((30 + BASH_REMATCH[6])); fi
          if [ "${BASH_REMATCH[5]}" = rc ]; then stage=$((60 + BASH_REMATCH[6])); fi
          expected_code=$(((BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3]) * 100 + stage))
          # As apksigner prints digests: lower-case hex, no colons.
          release_cert="$(tr -d ': ' <<<"$RELEASE_CERT_SHA256" | tr '[:upper:]' '[:lower:]')"
          if ! [[ "$release_cert" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the release environment variable RELEASE_CERT_SHA256 is unset or invalid: the SHA-256 hex digest only, colons allowed (ADR-0011)"
            exit 1
          fi
          # One per line.
          debug_certs="$(xargs -n1 <<<"$DEBUG_CERT_SHA256S" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$(wc -l <<<"$debug_certs")" -ne 2 ]; then
            echo "::error::DEBUG_CERT_SHA256S must list the two debug certificates (ADR-0011)"
            exit 1
          fi
          if grep -qxF "$release_cert" <<<"$debug_certs"; then
            echo "::error::RELEASE_CERT_SHA256 is a debug certificate (ADR-0011)"
            exit 1
          fi
          found="$(cd "$RUNNER_TEMP/out" && find . -mindepth 1 | sort | tr '\n' ' ')"
          if [ "$found" != "./stationbreak-amazon-v$VERSION.apk ./stationbreak-github-v$VERSION.apk " ]; then
            echo "::error::the signed output must hold exactly the two APKs; found: $found"
            exit 1
          fi
          # Fixed-string comparison of the package line's start (no regex: the dots in the version are literal).
          expected_prefix="package: name='tv.stationbreak.app' versionCode='$expected_code' versionName='$VERSION' "
          for flavor in github amazon; do
            apk="$RUNNER_TEMP/out/stationbreak-$flavor-v$VERSION.apk"
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            echo "::group::aapt2 dump badging ($flavor)"
            grep -E '^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)' <<<"$badging"
            echo "::endgroup::"
            package_line="$(grep -F -m1 'package: ' <<<"$badging")"
            if [ "${package_line#"$expected_prefix"}" = "$package_line" ]; then
              echo "::error::$flavor APK is not tv.stationbreak.app $VERSION (versionCode $expected_code)"
              exit 1
            fi
            if grep -q '^application-debuggable' <<<"$badging"; then
              echo "::error::$flavor release APK is debuggable (ADR-0011)"
              exit 1
            fi
            certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$apk")"
            echo "::group::apksigner verify --print-certs ($flavor)"
            echo "$certs"
            echo "::endgroup::"
            # Every digest line must be one of the counted `Signer #N` lines: a stray one would be a signer not counted.
            all_digests="$(grep -c 'certificate SHA-256 digest:' <<<"$certs" || true)"
            signer_digests="$(grep -cE '^Signer #[0-9]+ certificate SHA-256 digest: ' <<<"$certs" || true)"
            if [ "$all_digests" != "$signer_digests" ]; then
              echo "::error::$flavor APK: apksigner printed a certificate digest that is not a counted signer"
              exit 1
            fi
            signers="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<<"$certs" | sort -u)"
            if [ -z "$signers" ] || [ "$(wc -l <<<"$signers")" -ne 1 ]; then
              echo "::error::$flavor APK must have exactly one signer certificate"
              exit 1
            fi
            if grep -qxF "$signers" <<<"$debug_certs"; then
              echo "::error::$flavor APK is signed with a debug certificate (ADR-0011, #276)"
              exit 1
            fi
            if [ "$signers" != "$release_cert" ]; then
              echo "::error::$flavor APK's signer is not the pinned RELEASE_CERT_SHA256"
              exit 1
            fi
          done
          github_sha="$(sha256sum "$RUNNER_TEMP/out/stationbreak-github-v$VERSION.apk" | cut -d' ' -f1)"
          amazon_sha="$(sha256sum "$RUNNER_TEMP/out/stationbreak-amazon-v$VERSION.apk" | cut -d' ' -f1)"
          echo "github $github_sha"
          echo "amazon $amazon_sha"
          {
            echo "cert-sha256=$release_cert"
            echo "github-sha256=$github_sha"
            echo "amazon-sha256=$amazon_sha"
          } >> "$GITHUB_OUTPUT"

      # Handed to `publish`: the verified APKs. Kept 7 days for the same reason: the run can be re-run after a wait. Their hashes travel as job outputs, not in the artifact.
      - name: Upload the signed APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: internal-release-apks-signed
          path: |
            ${{ runner.temp }}/out/stationbreak-github-v${{ needs.build.outputs.version }}.apk
            ${{ runner.temp }}/out/stationbreak-amazon-v${{ needs.build.outputs.version }}.apk
          retention-days: 7
          if-no-files-found: error

  # No key, no checkout, no repository code. The only job with write permissions: it downloads what `sign` verified,
  # attests it and drafts the release. It runs after the owner's approval, because it needs `sign`.
  publish:
    needs: [build, sign]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The draft release.
      contents: write
      # The signing identity for the attestation.
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the signed APKs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-release-apks-signed
          path: ${{ runner.temp }}/out

      # The artifact store is not trusted: `sign` published the hash of each signed APK as a job output, and these must
      # match what was downloaded. The outputs themselves must be real SHA-256 values (a masked output would be empty).
      - name: Check the downloaded APKs against the signed hashes
        env:
          CERT_SHA256: ${{ needs.sign.outputs.cert-sha256 }}
          GITHUB_SHA256: ${{ needs.sign.outputs.github-sha256 }}
          AMAZON_SHA256: ${{ needs.sign.outputs.amazon-sha256 }}
        run: |
          for value in "$CERT_SHA256" "$GITHUB_SHA256" "$AMAZON_SHA256"; do
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then
              echo "::error::a hash or certificate output from the sign job is empty or not a SHA-256"
              exit 1
            fi
          done
          found="$(cd "$RUNNER_TEMP/out" && find . -mindepth 1 | sort | tr '\n' ' ')"
          if [ "$found" != "./stationbreak-amazon-v$VERSION.apk ./stationbreak-github-v$VERSION.apk " ]; then
            echo "::error::the signed artifact must hold exactly the two APKs; found: $found"
            exit 1
          fi
          cd "$RUNNER_TEMP/out"
          printf '%s  %s\n' "$GITHUB_SHA256" "stationbreak-github-v$VERSION.apk" \
            "$AMAZON_SHA256" "stationbreak-amazon-v$VERSION.apk" > "$RUNNER_TEMP/SHA256SUMS"
          # Fails on any APK that is not byte-for-byte what `sign` verified.
          sha256sum --check --strict "$RUNNER_TEMP/SHA256SUMS"

      # The artifact store is not trusted, so the notes are checked against the hash `build` published, as the APKs are.
      - name: Download the release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: internal-release-notes
          path: ${{ runner.temp }}/notes

      - name: Check the release notes
        env:
          NOTES_SHA256: ${{ needs.build.outputs.notes-sha256 }}
        run: |
          if ! [[ "$NOTES_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::the notes hash output from the build job is empty or not a SHA-256"
            exit 1
          fi
          found="$(cd "$RUNNER_TEMP/notes" && find . -mindepth 1 | sort | tr '\n' ' ')"
          if [ "$found" != "./release-notes.md " ]; then
            echo "::error::the release notes artifact must hold exactly release-notes.md; found: $found"
            exit 1
          fi
          printf '%s  %s\n' "$NOTES_SHA256" "$RUNNER_TEMP/notes/release-notes.md" > "$RUNNER_TEMP/notes.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/notes.sha256"

      # The tag could have been moved while the run waited for approval. It must still point at the commit that was
      # built; an annotated tag is followed to its commit. The check is a script so the same code runs twice: here, and
      # again right before the release is created.
      - name: Check the tag still points at the built commit
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > "$RUNNER_TEMP/check-tag.sh" <<'SCRIPT'
          ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')"
          read -r type sha <<<"$ref"
          for _ in 1 2 3; do
            if [ "$type" != tag ]; then break; fi
            ref="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.type + " " + .object.sha')"
            read -r type sha <<<"$ref"
          done
          if [ "$type" != commit ] || [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::tag $TAG now points at $type $sha, not the built commit $GITHUB_SHA"
            exit 1
          fi
          SCRIPT
          bash -eo pipefail "$RUNNER_TEMP/check-tag.sh"

      # Provenance for both APKs: they were built by this workflow, from this tag's commit.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/out/stationbreak-github-v${{ needs.build.outputs.version }}.apk
            ${{ runner.temp }}/out/stationbreak-amazon-v${{ needs.build.outputs.version }}.apk

      # A draft: the owner reads it, then publishes it. `--verify-tag` refuses to create a tag from this call. There is
      # no checkout, so the repository is passed explicitly.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          CERT_SHA256: ${{ needs.sign.outputs.cert-sha256 }}
        run: |
          cd "$RUNNER_TEMP/out"
          {
            echo "StationBreak $VERSION. Draft: check the files below, then publish."
            echo
            echo "Signing certificate SHA-256 (both APKs):"
            echo
            echo "\`$CERT_SHA256\`"
            echo
            echo "APK SHA-256 (also in the attached SHA256SUMS):"
            echo
            echo '```'
            cat "$RUNNER_TEMP/SHA256SUMS"
            echo '```'
            echo
            echo "Each APK has a build-provenance attestation: \`gh attestation verify <apk> --repo $GITHUB_REPOSITORY\`."
            echo "Check the certificate with \`apksigner verify --print-certs <apk>\`."
            echo
            echo "## What's changed"
            echo
            echo "Generated from the commits since the previous release: edit before publishing."
            echo
            # A release body is limited to 125000 characters; stay well under it.
            # Over the limit: cut at a line boundary (the last line, possibly partial, is dropped) and say so.
            if [ "$(wc -c < "$RUNNER_TEMP/notes/release-notes.md")" -le 60000 ]; then
              cat "$RUNNER_TEMP/notes/release-notes.md"
            else
              head -c 60000 "$RUNNER_TEMP/notes/release-notes.md" | sed '$d'
              echo "…(truncated)"
            fi
          } > "$RUNNER_TEMP/notes.md"
          # Once more, right before the release exists.
          bash -eo pipefail "$RUNNER_TEMP/check-tag.sh"
          # A pre-release tag (-alpha.N, -beta.N, -rc.N) is marked a pre-release, so it is never shown as the latest release.
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft "${prerelease[@]}" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "stationbreak-github-v$VERSION.apk" "stationbreak-amazon-v$VERSION.apk" "$RUNNER_TEMP/SHA256SUMS"
