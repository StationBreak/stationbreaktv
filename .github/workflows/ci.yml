name: CI

# Never pull_request_target: fork PRs must not get secrets or a write token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The head repo is part of the key, so a fork branch with the same name can't cancel our runs.
  # PRs share a group per branch and cancel superseded runs. Each main push gets its own group (by SHA), so a quick
  # second merge never cancels or replaces the first one's run and its main APK.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default "enhanced" provider is proprietary; "basic" wraps actions/cache.
          cache-provider: basic
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and assemble
        run: >-
          ./gradlew check
          assembleAmazonDebug assembleAmazonRelease
          assembleGithubDebug assembleGithubRelease
          --continue

      # TEMPORARY (throwaway, task 3.2): show what spotlessApply inserts, and that a second apply adds nothing.
      # ktlint can't auto-fix a wildcard import, so spotlessApply may still exit non-zero; the diff is what matters.
      - name: spotlessApply twice and diff
        if: always()
        run: |
          ./gradlew spotlessApply --continue || echo "first spotlessApply exited non-zero"
          git diff > /tmp/first.diff
          echo "::group::git diff after the first spotlessApply"
          cat /tmp/first.diff
          echo "::endgroup::"
          ./gradlew spotlessApply --continue || echo "second spotlessApply exited non-zero"
          git diff > /tmp/second.diff
          if cmp -s /tmp/first.diff /tmp/second.diff; then
            echo "second spotlessApply: no further diff"
          else
            echo "::error::second spotlessApply changed more:"
            diff /tmp/first.diff /tmp/second.diff || true
            exit 1
          fi
          exit 1

      - name: Name the debug APK
        id: apk
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          shortsha="${HEAD_SHA::7}"
          if [ "$EVENT_NAME" = pull_request ]; then
            name="stationbreak-github-debug-pr${PR_NUMBER}-${shortsha}.apk"
          else
            name="stationbreak-github-debug-main-${shortsha}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/app-github-debug.apk "dist/${name}"
          echo "path=dist/${name}" >> "$GITHUB_OUTPUT"

      - name: Inspect APKs
        env:
          # AGP 9.4's default build-tools version.
          BUILD_TOOLS_VERSION: 36.0.0
          DEBUG_APK: ${{ steps.apk.outputs.path }}
          # One release APK per flavor (amazon, github). Update when a flavor is added (play, F4.3).
          EXPECTED_RELEASE_APKS: 2
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          echo "::group::apksigner verify --print-certs (github debug)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$DEBUG_APK"
          echo "::endgroup::"
          BADGING_FIELDS='^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)'
          # Each dump is assigned first, so a missing APK or an aapt2 error fails the step (bash -e) instead of
          # being hidden by a pipe.
          badging="$("$BUILD_TOOLS/aapt2" dump badging "$DEBUG_APK")"
          echo "::group::aapt2 dump badging (github debug)"
          grep -E "$BADGING_FIELDS" <<<"$badging"
          echo "::endgroup::"
          # ADR-0011 condition 3: a release build is never debuggable. Check every flavor's release APK.
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#release_apks[@]}" -ne "$EXPECTED_RELEASE_APKS" ]; then
            echo "::error::expected $EXPECTED_RELEASE_APKS release APKs, found ${#release_apks[@]}: ${release_apks[*]}"
            exit 1
          fi
          for apk in "${release_apks[@]}"; do
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            echo "::group::aapt2 dump badging ($apk)"
            grep -E "$BADGING_FIELDS" <<<"$badging"
            echo "::endgroup::"
            if grep -q "^application-debuggable" <<<"$badging"; then
              echo "::error::release APK is debuggable (ADR-0011): $apk"
              exit 1
            fi
            echo "release APK not debuggable: $apk"
          done

      # Same-repo PRs only: fork PRs build and test but never get an APK (ADR-0011).
      - name: Upload PR debug APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload main debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          # Explicit, so a repo-level default change can't alter it. Main APKs are for device testing only.
          retention-days: 30
          if-no-files-found: error

  # Instrumented tests on the Insignia's Android version (API 25), so a call to a newer API crashes here, not on a
  # device. No `needs:`: it runs in parallel with `build`.
  emulator:
    runs-on: ubuntu-latest
    # Cold boot plus tests takes about 3.5 minutes; this catches a hang well before the default 6 hours.
    timeout-minutes: 15
    # Repeats the workflow default so this job stays read-only if the top level is ever widened for another job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # The emulator needs about 7.4 GB free to create its userdata partition and exits at launch without it; some
      # runners have had only 7.0 GB. These preinstalled toolchains are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator boots, so a compile error fails here rather than inside the emulator step.
      - name: Build the app and test APKs
        run: ./gradlew assembleGithubDebug assembleGithubDebugAndroidTest

      # Cold boot every run: a cached AVD snapshot hung on "device offline" in 3 of 8 runs; cold boot in 0 of 8.
      # A boot timeout or any failed test fails this step and the job.
      - name: Instrumented tests (API 25 Android TV)
        id: tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 25
          target: android-tv
          # The API 25 TV image exists only for x86.
          arch: x86
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # On failure, save logcat before the action shuts the emulator down.
          script: ./gradlew connectedGithubDebugAndroidTest || { adb logcat -d > app/build/logcat.txt; exit 1; }

      # Gradle's console output doesn't name the tests or show a failure's exception; the JUnit XML does.
      - name: Instrumented test results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          shopt -s globstar nullglob
          results=(app/build/outputs/androidTest-results/connected/**/TEST-*.xml)
          if [ "${#results[@]}" -eq 0 ]; then
            echo "No instrumented test results."
            exit 0
          fi
          for f in "${results[@]}"; do
            echo "::group::$f"
            grep -oE '<testsuite [^>]*>' "$f" || true
            grep -oE '<testcase [^>]*>' "$f" || true
            grep -A5 '<failure' "$f" || true
            echo "::endgroup::"
          done

      # Test reports and logcat only, no APK, so fork PRs can have it too (ADR-0011 gates APKs).
      - name: Upload instrumented test reports
        if: failure() && steps.tests.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/logcat.txt
          retention-days: 7
          if-no-files-found: ignore

  # Every commit in a PR needs a Signed-off-by: trailer (ADR-0003). Only a GitHub-verified renovate[bot] commit is
  # exempt; see .github/scripts/dco-check.sh.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test the DCO checker
        run: bash .github/scripts/dco-check.test.sh

      - name: Check sign-offs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            | jq 'add' \
            | bash .github/scripts/dco-check.sh
