name: CI

# Never pull_request_target: fork PRs must not get secrets or a write token.
on:
  pull_request:
    # `ready_for_review` is listed because a draft's pushes are skipped (see `checks`); marking it ready runs CI once.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The head repo is part of the key, so a fork branch with the same name can't cancel our runs.
  # PRs share a group per branch and cancel superseded runs. Each main push gets its own group (by SHA), so a quick
  # second merge never cancels or replaces the first one's run and its main APK.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The small checks, in one job: Actions bills every job as at least a whole minute, and each of these takes seconds.
  # Fail-fast, so the failing step's name says which check broke. It also decides which of the big jobs a PR needs
  # (the "Decide what to run" step), and the output is set before any check can fail.
  checks:
    # Draft PRs don't run CI: the local preflight (scripts/preflight.sh) does the iterating. Every other job needs
    # this one, except osv-scanner, which has its own copy of the condition.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # To list the PR's commits (the sign-off check). Read-only.
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
      emulator: ${{ steps.scope.outputs.emulator }}
      deps: ${{ steps.scope.outputs.deps }}
      release: ${{ steps.scope.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the scope step diffs against the PR's base, and gitleaks scans every commit in the PR.
          fetch-depth: 0
          persist-credentials: false

      # Pushes to main always run everything. A PR skips `verify` and `assemble` when it changes only docs, and `emulator` unless it
      # changes the app, the modules, or the build. Anything not matched below counts as a build change, and if the
      # diff can't be read both jobs run. A skipped job still reports as skipped, not pending, so this is safe to
      # make a required check later (unlike workflow-level paths-ignore). `deps` says whether osv-scanner is needed:
      # the PR touches the dependency files or the build logic. `release` says whether the release variants are built
      # and checked: always on main, and on a PR only when it touches what R8, the manifest merger, signing or the
      # release dependencies depend on (.github/scripts/release-scope.sh lists them, with tests). Other PRs check and
      # assemble the debug variants only; the debug APK is built either way, for the device tests.
      - name: Decide what to run
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          build=true
          emulator=true
          deps=true
          release=true
          # --no-renames: a move lists both its old and new path, so moving a file out of a release-only place is seen.
          if [ "$EVENT_NAME" = pull_request ] &&
            files="$(git -c core.quotePath=false diff --name-only --no-renames "${BASE_SHA}...${HEAD_SHA}")" &&
            [ -n "$files" ]; then
            printf 'Changed files:\n%s\n' "$files"
            if ! grep -qvE '^(docs/|LICENSE|.*\.md$)' <<<"$files"; then
              build=false
            fi
            if ! grep -qE '^(app/|core/|data/|feature/|build-logic/|gradle/|gradle\.properties$|settings\.gradle\.kts$|.*\.gradle\.kts$|\.github/workflows/ci\.yml$)' <<<"$files"; then
              emulator=false
            fi
            if ! grep -qE '^(gradle/|gradle\.properties$|settings\.gradle\.kts$|.*\.gradle\.kts$|build-logic/)' <<<"$files"; then
              deps=false
            fi
            # The patch feeds the script's content rule. If it can't be read, run the release build, as for an
            # unreadable file list.
            if git diff -U0 --no-renames "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/pr.patch"; then
              release="$(bash .github/scripts/release-scope.sh "$RUNNER_TEMP/pr.patch" <<<"$files")"
            fi
          fi
          # No build means no emulator, even if the pattern matched.
          if [ "$build" = false ]; then emulator=false; fi
          {
            echo "build=$build"
            echo "emulator=$emulator"
            echo "deps=$deps"
            echo "release=$release"
          } >> "$GITHUB_OUTPUT"

      # Every commit in a PR needs a Signed-off-by: trailer (ADR-0003). Only a GitHub-verified renovate[bot] commit is
      # exempt; see .github/scripts/dco-check.sh.
      - name: Test the DCO checker
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/dco-check.test.sh

      - name: Check sign-offs
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/commits" \
            | jq 'add' \
            | bash .github/scripts/dco-check.sh

      # Fixture tests for the scripts the workflows run. dco-check.sh's tests run in the steps above, just before the
      # real check; osv-issues.sh's also run in osv-weekly.yml before it opens issues. The verification guard runs
      # here on the checkout itself, and so does the device-proof guard.
      - name: Test the OSV issue opener
        run: bash .github/scripts/osv-issues.test.sh

      # The emulator job's retry decision: only an infrastructure failure is ever retried.
      - name: Test the instrumented infra classifier
        run: bash .github/scripts/instrumented-infra.test.sh

      # Which modules must write instrumented results (shared with scripts/preflight.sh).
      - name: Test the instrumented results rule
        run: bash .github/scripts/connected-results.test.sh

      # Which PRs also build the release variants (the `release` output above).
      - name: Test the release-scope classifier
        run: bash .github/scripts/release-scope.test.sh

      # ADR-0013: fails if the dependency verification file or its settings are loosened, or a workflow turns
      # verification off or rewrites the file. The tests run first, so a broken guard can't pass the real check.
      - name: Test the dependency verification guard
        run: bash .github/scripts/verification-guard.test.sh

      - name: Dependency verification guard
        run: bash .github/scripts/verification-guard.sh .

      # Spec 03, Unit 4 (R15): no workflow, script or Gradle file may hand CI the on-device probe's server address.
      # The tests run first, so a broken guard can't pass the real check.
      - name: Test the device-proof guard
        run: bash .github/scripts/device-proof-guard.test.sh

      - name: Device-proof guard
        run: bash .github/scripts/device-proof-guard.sh .

      # Workflow syntax, expressions and job references, plus shellcheck (preinstalled on the runner) on `run:` scripts.
      - name: Install actionlint
        env:
          # renovate: datasource=github-releases depName=rhysd/actionlint
          ACTIONLINT_VERSION: 1.7.12
          # From the release's checksums file for ACTIONLINT_VERSION. Pinned here rather than fetched with the
          # tarball, so a replaced release asset fails the check. Renovate bumps the version only; this step fails
          # until the SHA-256 is updated by hand from the new release's checksums file.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint

      - name: actionlint
        run: '"$RUNNER_TEMP/actionlint" -color'

      # Static analysis of the workflows themselves: template injection, excessive permissions, unpinned actions and
      # the like. Fails on high-severity findings.
      - name: zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # SARIF upload needs GitHub Advanced Security; findings go to the log and annotations instead.
          advanced-security: false
          annotations: true
          min-severity: high
          # No `version:`: the action then runs the zizmor image digest it ships as "latest" (1.30.1 at v0.6.4),
          # so zizmor is pinned by the action's SHA and Renovate updates both together.

      # Secrets in the PR's commits (every commit, not just the final diff). The CLI is run directly; gitleaks-action
      # needs a licence for organisations.
      - name: Install gitleaks
        if: github.event_name == 'pull_request'
        env:
          # renovate: datasource=github-releases depName=gitleaks/gitleaks
          GITLEAKS_VERSION: 8.30.1
          # From the release's checksums file for GITLEAKS_VERSION; pinned here for the same reason as actionlint's.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks

      - name: Scan the PR's commits for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # The base commit's config, so a PR can't loosen the scan of its own commits by editing .gitleaks.toml.
          config="$RUNNER_TEMP/gitleaks.toml"
          if ! git show "${BASE_SHA}:.gitleaks.toml" >"$config" 2>/dev/null; then
            # The base has no config yet (the PR that adds it): default rules, no allowlist.
            printf '[extend]\nuseDefault = true\n' >"$config"
          fi
          # Nor can it silence a finding: inline gitleaks:allow comments are ignored, and so is any .gitleaksignore.
          # gitleaks reads one from the repo root even with --gitleaks-ignore-path set, so remove it from the
          # checkout (the scan reads commits, not the working tree).
          rm -f .gitleaksignore
          # --verbose prints each finding (rule, file, commit), with the secret redacted.
          "$RUNNER_TEMP/gitleaks" git --config "$config" --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --ignore-gitleaks-allow --gitleaks-ignore-path "$RUNNER_TEMP" \
            --redact --verbose --no-banner --exit-code 1

  # `build` was split in two (verify, assemble) so each fits its timeout on a cold build cache. They run in parallel on
  # separate runners, each with its own Gradle caches, and both are skipped for docs-only PRs (see `checks`). Measured
  # on PR #247's run, a cold cache, one 2-core runner, one Gradle invocation: module rules 1m21s + KMP tests 0m28s +
  # 26m07s for `check` and the three assembles together, which hit the old 30-minute limit on slower runs. Within the
  # 26 minutes, `check` (detekt, lint, unit tests) kept the runner busy until about the 15 minute mark and the release
  # work (R8, lintVital, dex, packaging) filled the rest, so each job is about 12 to 20 minutes cold, alone on its
  # runner. Their timeouts are 1.5 to 2 times that. To change the split, move tasks between the two Gradle steps.
  verify:
    needs: checks
    # Not skipped when a check fails: the job still reports. Skipped for docs-only PRs (see `checks`).
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # About 20 minutes cold (a build-logic change or a new dependency empties the build cache), 8 to 10 warm: 30
    # leaves a third of headroom for a slow runner without hiding a hang.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar. Its own caching is off: the default provider is proprietary, and the
      # open-source "basic" one restores only an exact key (a hash of the build files), so every PR that changed a
      # build file started with an empty cache. The steps below cache the Gradle User Home instead.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Downloaded dependencies and the wrapper distribution. The exact key is a hash of the build files; a PR that
      # changes them falls back to main's newest entry (restore-keys) and downloads only what's new. Only main writes,
      # so a PR can't change what main restores. This job keeps the old `build` job's key, so it starts warm.
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-build-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-build-v2-${{ runner.os }}-

      # Kotlin/Native's compiler bundle and toolchain (LLVM, sysroot) for the linuxX64 canary: about 30 s to fetch and
      # unpack. Keyed on the Kotlin version alone, so PRs that change build files still reuse it (the Gradle cache's
      # key changes with them). As with the Gradle cache, only main writes it.
      - name: Kotlin version
        id: kotlin
        run: |
          version="$(sed -n 's/^kotlin = "\(.*\)"$/\1/p' gradle/libs.versions.toml)"
          test -n "$version" || { echo "::error::no kotlin version in gradle/libs.versions.toml"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Kotlin/Native
        id: konan
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-v1-${{ runner.os }}-${{ steps.kotlin.outputs.version }}

      # Gradle's build cache (org.gradle.caching): task outputs, so a PR reuses main's work for the modules it didn't
      # change. Kept out of the dependency cache above (its path excludes build-cache-1) because it changes on every
      # push: main saves it every time under its commit's key, and everything restores main's newest. Only main
      # writes, so a PR can't change what main restores. Gradle drops entries unused for 7 days. The second
      # restore-key is the old combined `build` job's chain, so the first runs after the split start warm; it
      # can be dropped once the verify chain has been saved on main.
      - name: Restore Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-verify-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-outputs-verify-v1-${{ runner.os }}-
            gradle-outputs-build-v1-${{ runner.os }}-

      # MODULES.md's dependency rules and the tools:overrideLibrary guard, first and on their own: an edge that breaks
      # the rules (a [JVM] module depending on an Android module, say) can also fail the full build earlier, with a
      # Gradle variant-matching error that doesn't say which rule. These tasks resolve nothing, so they always run.
      - name: Module dependency rules
        run: ./gradlew checkArchitecture checkOverrideLibrary

      # ADR-0004: the shared core's tests run with no Android SDK, even though Android modules share the build.
      - name: KMP tests with no Android SDK
        run: env -u ANDROID_HOME -u ANDROID_SDK_ROOT ./gradlew :core:model:jvmTest :core:scheduler:jvmTest

      # Lint, detekt, spotless and the unit tests of every module. The assembles are the `assemble` job's.
      # A PR that doesn't need the release build (see `checks`) excludes exactly the release-variant tasks that
      # `check` pulls in: detekt's type-resolving task per release variant, and licensee's per release variant. Those
      # make Gradle compile every Android module's release variant a second time; nothing else differs. `check`
      # already lints and unit-tests only the debug variants, and the KMP, JVM, spotless, architecture and
      # trust-surface tasks are untouched. Main and risky PRs run the full `check`.
      - name: Check
        env:
          RELEASE: ${{ needs.checks.outputs.release }}
        run: |
          skip=()
          # Only an explicit false narrows it; an empty output runs everything.
          if [ "$RELEASE" = false ]; then
            skip=(-x detektRelease -x detektAmazonRelease -x detektGithubRelease
                  -x licenseeAndroidAmazonRelease -x licenseeAndroidGithubRelease)
          fi
          ./gradlew check --continue "${skip[@]}"

      # After the Gradle steps, on main: the dependency cache when the build files changed (a new key), the build cache
      # every time. The daemon is stopped first so it isn't writing to the caches while they're archived. The sizes
      # are logged so growth is visible; each new key's entry starts from the previous one. To reset a chain, bump
      # the vN in its cache key prefix.
      - name: Stop Gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew --stop
          du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/caches/build-cache-1 || true

      - name: Save Gradle caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-verify-v1-${{ runner.os }}-${{ github.sha }}

      - name: Save Kotlin/Native
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.konan.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: ${{ steps.konan.outputs.cache-primary-key }}

  assemble:
    needs: checks
    # As for `verify`.
    if: ${{ !cancelled() && needs.checks.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    # About 12 to 14 minutes cold (R8, lintVital and dex for two release flavors and a debug build), 6 to 8 warm: 25
    # is about twice the cold time, since an R8 or dex task can run long on a slow runner.
    timeout-minutes: 25
    outputs:
      # The debug APK's file name, for `sign-debug`.
      apk-name: ${{ steps.apk.outputs.name }}
      # The benchmark APK's file name (main only; empty otherwise), for `sign-debug`.
      benchmark-apk-name: ${{ steps.apk.outputs.benchmark-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Caching as in `verify`, with this job's own entries (it resolves less, and its build outputs are different
      # ones). Neither job needs the other's: they run at the same time.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # The second restore-key is `verify`'s chain, so this job's first entry on main starts from it.
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-assemble-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-assemble-v2-${{ runner.os }}-
            gradle-build-v2-${{ runner.os }}-

      - name: Restore Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-assemble-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-outputs-assemble-v1-${{ runner.os }}-
            gradle-outputs-build-v1-${{ runner.os }}-

      # No assembleAmazonDebug: nothing uploads or inspects that APK, and `check` (in `verify`) already compiles,
      # lints and unit-tests the variant. Its dex merge was the slowest task in the old combined job.
      # The release variants are built only on main and for a PR that can change what they contain (see `checks`);
      # the github debug APK is built every time, for the device tests. On main, the github benchmark APK (release code,
      # not debuggable) is built too, for device measurements (#392).
      - name: Assemble
        env:
          RELEASE: ${{ needs.checks.outputs.release }}
        run: |
          tasks=(assembleGithubDebug)
          # Only an explicit false narrows it; an empty output runs everything.
          if [ "$RELEASE" != false ]; then
            tasks+=(assembleAmazonRelease assembleGithubRelease)
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            tasks+=(assembleGithubBenchmark)
          fi
          ./gradlew "${tasks[@]}" --continue

      # After the Gradle step, on main, as in `verify`.
      - name: Stop Gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew --stop
          du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/caches/build-cache-1 || true

      - name: Save Gradle caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-assemble-v1-${{ runner.os }}-${{ github.sha }}

      - name: Name the debug APK
        id: apk
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          shortsha="${HEAD_SHA::7}"
          if [ "$EVENT_NAME" = pull_request ]; then
            name="stationbreak-github-debug-pr${PR_NUMBER}-${shortsha}.apk"
          else
            name="stationbreak-github-debug-main-${shortsha}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/app-github-debug.apk "dist/${name}"
          {
            echo "name=${name}"
            echo "path=dist/${name}"
          } >> "$GITHUB_OUTPUT"
          if [ "$EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            benchmark="stationbreak-github-benchmark-main-${shortsha}.apk"
            mkdir -p dist-benchmark
            cp app/build/outputs/apk/github/benchmark/app-github-benchmark.apk "dist-benchmark/${benchmark}"
            {
              echo "benchmark-name=${benchmark}"
              echo "benchmark-path=dist-benchmark/${benchmark}"
              echo "mapping-name=${benchmark%.apk}-mapping"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Inspect APKs
        env:
          # AGP 9.4's default build-tools version.
          BUILD_TOOLS_VERSION: 36.0.0
          DEBUG_APK: ${{ steps.apk.outputs.path }}
          # Empty except on main.
          BENCHMARK_APK: ${{ steps.apk.outputs.benchmark-path }}
          # One release APK per flavor (amazon, github). Update when a flavor is added (play, F4.3). None when the
          # release variants weren't built (see `checks`).
          # Strings, not numbers: in an expression the number 0 is falsy, so `&& 0 || 2` would always give 2.
          EXPECTED_RELEASE_APKS: ${{ needs.checks.outputs.release == 'false' && '0' || '2' }}
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          echo "::group::apksigner verify --print-certs (github debug)"
          certs="$("$BUILD_TOOLS/apksigner" verify --print-certs "$DEBUG_APK")"
          echo "$certs"
          echo "::endgroup::"
          BADGING_FIELDS='^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)'
          # Each dump is assigned first, so a missing APK or an aapt2 error fails the step (bash -e) instead of
          # being hidden by a pipe.
          badging="$("$BUILD_TOOLS/aapt2" dump badging "$DEBUG_APK")"
          echo "::group::aapt2 dump badging (github debug)"
          grep -E "$BADGING_FIELDS" <<<"$badging"
          echo "::endgroup::"
          # The benchmark APK measures what ships: it must not be debuggable.
          if [ -n "$BENCHMARK_APK" ]; then
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$BENCHMARK_APK")"
            echo "::group::aapt2 dump badging (github benchmark)"
            grep -E "$BADGING_FIELDS" <<<"$badging"
            echo "::endgroup::"
            if grep -q "^application-debuggable" <<<"$badging"; then
              echo "::error::benchmark APK is debuggable (#392): $BENCHMARK_APK"
              exit 1
            fi
            # Release code is signed with the CI debug key only under the benchmark ID, never the production one.
            if ! grep -q "^package: name='tv\.stationbreak\.app\.benchmark'" <<<"$badging"; then
              echo "::error::benchmark APK's package is not tv.stationbreak.app.benchmark (ADR-0011): $BENCHMARK_APK"
              exit 1
            fi
          fi
          # ADR-0011 condition 3: a release build is never debuggable. Check every flavor's release APK.
          shopt -s nullglob
          release_apks=(app/build/outputs/apk/*/release/*.apk)
          if [ "${#release_apks[@]}" -ne "$EXPECTED_RELEASE_APKS" ]; then
            echo "::error::expected $EXPECTED_RELEASE_APKS release APKs, found ${#release_apks[@]}: ${release_apks[*]}"
            exit 1
          fi
          for apk in "${release_apks[@]}"; do
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            echo "::group::aapt2 dump badging ($apk)"
            grep -E "$BADGING_FIELDS" <<<"$badging"
            echo "::endgroup::"
            if grep -q "^application-debuggable" <<<"$badging"; then
              echo "::error::release APK is debuggable (ADR-0011): $apk"
              exit 1
            fi
            echo "release APK not debuggable: $apk"
          done

      # Handed to `sign-debug`, which re-signs it with the CI debug key. Kept a day: only that job reads it. Main and
      # same-repo PRs only: fork PRs and Renovate's PRs build and test but never get an APK (ADR-0011).
      - name: Upload the debug APK for signing
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'renovate[bot]')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debug-apk-runner-key
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1
          if-no-files-found: error

      # Main only. Handed to `sign-debug` like the debug APK above.
      - name: Upload the benchmark APK for signing
        if: steps.apk.outputs.benchmark-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-apk-runner-key
          path: ${{ steps.apk.outputs.benchmark-path }}
          retention-days: 1
          if-no-files-found: error

      # Main only, with the benchmark APK. R8 inlines methods and rewrites line numbers even with -dontobfuscate, so a
      # stack trace from that APK needs this file (#435). Named like the APK (same short SHA) and kept as long as the
      # signed APK is (30 days). Uploaded here, not in `sign-debug`, which has no checkout. A missing file fails the job.
      # CI uploads no release APK, so there is no release mapping to keep.
      - name: Upload the benchmark R8 mapping
        if: steps.apk.outputs.mapping-name != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.apk.outputs.mapping-name }}
          path: app/build/outputs/mapping/githubBenchmark/mapping.txt
          retention-days: 30
          if-no-files-found: error

  # ADR-0011 (amended 2026-10-18): Gradle signs the debug APK with the runner's own key; this job re-signs it with the
  # CI debug key, held in secrets, so each CI debug APK installs over the last on a test device. It is a separate job
  # so the key is only ever decoded on a fresh runner that runs no repository code: no checkout, no Gradle, nothing a
  # build step could have left behind in the environment, PATH or a background process. Only this job reads the
  # DEBUG_KEYSTORE_* secrets. Fork PRs and Renovate's PRs never reach it. A push to main without the key fails.
  sign-debug:
    needs: assemble
    if: ${{ !cancelled() && needs.assemble.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'renovate[bot]')) }}
    runs-on: ubuntu-latest
    # Under a minute: a download, a re-sign and an upload.
    timeout-minutes: 10
    steps:
      # Outside the workspace, so the input can't be confused with the output.
      - name: Download the debug APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debug-apk-runner-key
          path: ${{ runner.temp }}/in

      - name: Download the benchmark APK
        if: needs.assemble.outputs.benchmark-apk-name != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: benchmark-apk-runner-key
          path: ${{ runner.temp }}/in

      - name: Sign the debug APK with the CI debug key
        id: sign
        env:
          # The runner image's build-tools, as in `assemble`'s "Inspect APKs".
          BUILD_TOOLS_VERSION: 36.0.0
          APK_NAME: ${{ needs.assemble.outputs.apk-name }}
          # Main only; empty otherwise. Signed with the same key (#392).
          BENCHMARK_APK_NAME: ${{ needs.assemble.outputs.benchmark-apk-name }}
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::the CI debug key secrets are missing (ADR-0011)"
            exit 1
          fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          if [ ! -x "$BUILD_TOOLS/apksigner" ]; then
            echo "::error::build-tools $BUILD_TOOLS_VERSION is not on the runner image"
            exit 1
          fi
          store="$RUNNER_TEMP/stationbreak-debug.p12"
          # The key file goes when this step ends, whatever the outcome.
          trap 'rm -f "$store"' EXIT
          (umask 077 && base64 -d <<<"$KEYSTORE_B64" > "$store")
          # The certificate's SHA-256, lower-case hex without colons as apksigner prints it. It is public.
          sha256="$(keytool -list -v -keystore "$store" -storetype PKCS12 -storepass:env KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$sha256" ]; then
            echo "::error::could not read the CI debug key's certificate"
            exit 1
          fi
          mkdir -p dist
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$store" --ks-type PKCS12 --ks-key-alias stationbreak-debug \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --v4-signing-enabled false \
            --out "dist/${APK_NAME}" "$RUNNER_TEMP/in/${APK_NAME}"
          if [ -n "$BENCHMARK_APK_NAME" ]; then
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$store" --ks-type PKCS12 --ks-key-alias stationbreak-debug \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --v4-signing-enabled false \
              --out "dist/${BENCHMARK_APK_NAME}" "$RUNNER_TEMP/in/${BENCHMARK_APK_NAME}"
            echo "benchmark-path=dist/${BENCHMARK_APK_NAME}" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "path=dist/${APK_NAME}"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      # An uploaded debug APK carries the CI debug key, and only that key.
      - name: Check the signer
        env:
          BUILD_TOOLS_VERSION: 36.0.0
          DEBUG_APK: ${{ steps.sign.outputs.path }}
          BENCHMARK_APK: ${{ steps.sign.outputs.benchmark-path }}
          DEBUG_CERT_SHA256: ${{ steps.sign.outputs.sha256 }}
        run: |
          apks=("$DEBUG_APK")
          if [ -n "$BENCHMARK_APK" ]; then apks+=("$BENCHMARK_APK"); fi
          for apk in "${apks[@]}"; do
            certs="$("$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "$apk")"
            echo "$certs"
            signers="$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' <<<"$certs" | sort -u)"
            if [ "$signers" != "$DEBUG_CERT_SHA256" ]; then
              echo "::error::$apk is not signed with the CI debug key alone (ADR-0011)"
              exit 1
            fi
            echo "$apk signed with the CI debug key"
          done

      - name: Upload PR debug APK
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.sign.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload main debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.sign.outputs.path }}
          archive: false
          # Explicit, so a repo-level default change can't alter it. Main APKs are for device testing only.
          retention-days: 30
          if-no-files-found: error

      # Main only (the benchmark APK is not built for PRs). For device measurements; never published (#392).
      - name: Upload main benchmark APK
        if: steps.sign.outputs.benchmark-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.sign.outputs.benchmark-path }}
          archive: false
          retention-days: 30
          if-no-files-found: error

  # Instrumented tests on the Insignia's Android version (API 25), so a call to a newer API crashes here, not on a
  # device. It runs in parallel with `verify` and `assemble`, once `checks` has decided it's needed: not for docs-only PRs, nor for
  # PRs that touch neither the app, the modules nor the build.
  emulator:
    needs: checks
    if: ${{ !cancelled() && needs.checks.outputs.emulator == 'true' }}
    runs-on: ubuntu-latest
    # Setup 3 + cold build ~10 + attempt 12 (step limit) + retry 12 + cleanup and uploads 3 = 40.
    # Still catches a hang well before the default 6 hours.
    timeout-minutes: 40
    # Repeats the workflow default so this job stays read-only if the top level is ever widened for another job.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      # Caching as in the build job, with this job's own entries (it resolves less).
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-disabled: true

      # Downloaded dependencies and the wrapper distribution. The exact key is a hash of the build files; a PR that
      # changes them falls back to main's newest entry (restore-keys) and downloads only what's new. Only main writes,
      # so a PR can't change what main restores.
      - name: Restore Gradle caches
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: gradle-emulator-v2-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-emulator-v2-${{ runner.os }}-

      # The emulator needs about 7.4 GB free to create its userdata partition and exits at launch without it; some
      # runners have had only 7.0 GB. These preinstalled toolchains are unused here.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The app's github debug tests, plus the debug tests of every Android library module that has androidTest
      # sources (none yet; core:ui is picked up when it gets some).
      - name: List instrumented test tasks
        id: instrumented
        run: |
          assemble="assembleGithubDebug assembleGithubDebugAndroidTest"
          connected="connectedGithubDebugAndroidTest"
          # Only the module roots that exist yet (feature/ comes with the first feature module).
          roots=()
          for root in core data feature; do
            if [ -d "$root" ]; then roots+=("$root"); fi
          done
          while IFS= read -r build_file; do
            dir="$(dirname "$build_file")"
            if [ -d "$dir/src/androidTest" ]; then
              project=":${dir//\//:}"
              assemble+=" $project:assembleDebugAndroidTest"
              connected+=" $project:connectedDebugAndroidTest"
            fi
          done < <(grep -rl --include=build.gradle.kts 'id("stationbreak.android-lib")' "${roots[@]}")
          echo "assemble=$assemble" >> "$GITHUB_OUTPUT"
          echo "connected=$connected" >> "$GITHUB_OUTPUT"

      # The build cache, as in the build job, with this job's own entries. After the disk is freed: the emulator needs
      # that space.
      - name: Restore Gradle build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-emulator-v1-${{ runner.os }}-${{ github.sha }}
          restore-keys: gradle-outputs-emulator-v1-${{ runner.os }}-

      # Built before the emulator boots, so a compile error fails here rather than inside the emulator step.
      - name: Build the app and test APKs
        env:
          ASSEMBLE_TASKS: ${{ steps.instrumented.outputs.assemble }}
        # Unquoted on purpose, as in the emulator step: a space-separated task list, and task names have no spaces.
        run: |
          # shellcheck disable=SC2086
          ./gradlew $ASSEMBLE_TASKS

      # Cold boot every run: a cached AVD snapshot hung on "device offline" in 3 of 8 runs; cold boot in 0 of 8.
      # The emulator itself is the flaky part (a surfaceflinger crash, a boot that never finishes, a stalled run),
      # so a failed attempt is retried once, and only when .github/scripts/instrumented-infra.sh says the failure
      # was infrastructure: an empty <failure>, a system crash in the logcat, a dead emulator or adb, no results at
      # all (a boot failure), a step cut off by its timeout with a module's results missing, a pass in which a module
      # with instrumented tests wrote no results (AGP counts a lost APK install as a pass, #489; `run` checks for it,
      # and the retry's own check fails the job with an ::error:: naming the modules; attempt 1's miss is only a warning), or one of two known
      # system-dialog signatures (INJECT_EVENTS refused; "No compose hierarchies found" as the only failure). Before
      # each attempt `run` also calms the AVD and enlarges the logcat (its `prepare` step). A failure with any other
      # message is a real test failure and fails the job at once. Each attempt's own timeout is below the job's, so a stall to the limit can still be retried.
      - name: Instrumented tests (API 25 Android TV)
        id: tests
        continue-on-error: true
        # A normal attempt takes 7 to 8 minutes (boot ~1.5, tests ~6); 12 leaves 50% headroom for a slow runner.
        timeout-minutes: 12
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 25
          target: android-tv
          # The API 25 TV image exists only for x86.
          arch: x86
          # A TV screen. Without it the AVD gets a 320x640 skin that flips between portrait and landscape as
          # activities start, which relaunches the activity under a Compose test (#444). tv_720p is 960x540 dp, the
          # same layout as the Fire TVs and as scripts/preflight.sh's tv_1080p, with a quarter of the pixels for the
          # software GPU: on tv_1080p the first attempt ran out of time.
          profile: tv_720p
          # Keep -gpu in step with scripts/preflight.sh.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # On failure, saves the logcat and the emulator's state before the action shuts the emulator down.
          script: bash .github/scripts/instrumented-infra.sh run instrumented-diag/attempt1
        env:
          CONNECTED_TASKS: ${{ steps.instrumented.outputs.connected }}

      - name: Was the failure infrastructure?
        id: infra
        if: steps.tests.outcome != 'success'
        # The modules that should have reported, so a cut-off step with a module missing is recognised.
        env:
          CONNECTED_TASKS: ${{ steps.instrumented.outputs.connected }}
        run: |
          # Not a pipe into tee: the exit status of the script is the answer.
          if reason="$(bash .github/scripts/instrumented-infra.sh classify instrumented-diag/attempt1)"; then
            echo "retry=true" >> "$GITHUB_OUTPUT"
          else
            echo "retry=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::warning::Instrumented tests, attempt 1 failed: ${reason}"

      # Attempt 1's results move to instrumented-diag/attempt1/results (uploaded with the reports), and any emulator
      # or adb left over from it, orphaned by a timeout or a crash, is killed.
      - name: Clean up before the retry
        if: steps.infra.outputs.retry == 'true'
        run: bash .github/scripts/instrumented-infra.sh cleanup instrumented-diag/attempt1

      - name: Instrumented tests, retry (API 25 Android TV)
        id: tests-retry
        if: steps.infra.outputs.retry == 'true'
        # A normal attempt takes 7 to 8 minutes (boot ~1.5, tests ~6); 12 leaves 50% headroom for a slow runner.
        timeout-minutes: 12
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 25
          target: android-tv
          arch: x86
          profile: tv_720p
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/instrumented-infra.sh run instrumented-diag/attempt2 final
        env:
          CONNECTED_TASKS: ${{ steps.instrumented.outputs.connected }}

      # Attempt 1 ran with continue-on-error, so a failure it was not retried for fails the job here.
      - name: Fail on a test failure that was not retried
        if: steps.tests.outcome != 'success' && steps.infra.outputs.retry != 'true'
        run: |
          echo "::error::Instrumented tests failed and the failure is not infrastructure; see the test results."
          exit 1

      # After the Gradle steps, on main: the dependency cache when the build files changed (a new key), the build cache
      # every time. The daemon is stopped first so it isn't writing to the caches while they're archived. The sizes
      # are logged so growth is visible; each new key's entry starts from the previous one. To reset a chain, bump
      # the vN in its cache key prefix.
      - name: Stop Gradle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ./gradlew --stop
          du -sh ~/.gradle/caches ~/.gradle/wrapper ~/.gradle/caches/build-cache-1 || true

      - name: Save Gradle caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-1
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save Gradle build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-outputs-emulator-v1-${{ runner.os }}-${{ github.sha }}

      # Gradle's console output doesn't name the tests or show a failure's exception; the JUnit XML does.
      - name: Instrumented test results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          shopt -s globstar nullglob
          results=(**/build/outputs/androidTest-results/connected/**/TEST-*.xml)
          if [ "${#results[@]}" -eq 0 ]; then
            echo "No instrumented test results."
            exit 0
          fi
          for f in "${results[@]}"; do
            echo "::group::$f"
            grep -oE '<testsuite [^>]*>' "$f" || true
            grep -oE '<testcase [^>]*>' "$f" || true
            grep -A5 '<failure' "$f" || true
            echo "::endgroup::"
          done

      # Test reports and logcat only, no APK, so fork PRs can have it too (ADR-0011 gates APKs).
      - name: Upload instrumented test reports
        if: failure() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            app/build/logcat.txt
          retention-days: 7
          if-no-files-found: ignore

      # Attempt 1's logcat, emulator state and results, kept even when the retry passed, so retries can be audited.
      - name: Upload attempt 1 diagnostics
        if: always() && steps.tests.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-attempt1-diag
          path: instrumented-diag/
          retention-days: 7
          if-no-files-found: ignore

  # Known vulnerabilities in dependencies. Scans the base and the PR head and fails only on vulnerabilities the PR
  # introduces. The packages come from gradle/verification-metadata.xml. The verification guard's test fixtures
  # (.github/scripts/fixtures/) are lockfiles too, so they're scanned as well.
  # Only on PRs that change the dependency files or the build logic (see `checks`), and not on drafts. `checks` is
  # skipped for a draft, so `deps` is empty then; `!cancelled()` keeps it running when a check fails.
  osv-scanner:
    needs: checks
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.draft != true && needs.checks.outputs.deps == 'true' }}
    # The called workflow's job declares all three, and a caller must grant at least what it declares or the run
    # fails to start (tried with contents: read alone: startup_failure). security-events: write is used only to
    # upload SARIF, which is off; actions: read is for that upload too.
    permissions:
      actions: read
      contents: read
      security-events: write
