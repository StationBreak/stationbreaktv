name: CI

# Never pull_request_target: fork PRs must not get secrets or a write token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The head repo is part of the key, so a fork branch with the same name can't cancel our runs.
  # PRs share a group per branch and cancel superseded runs. Each main push gets its own group (by SHA), so a quick
  # second merge never cancels or replaces the first one's run and its main APK.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        variant: [snapshot, cold]
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    permissions:
      contents: read
    env:
      # The API 25 TV image exists only for x86.
      EMULATOR_API_LEVEL: 25
      EMULATOR_TARGET: android-tv
      EMULATOR_ARCH: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Built before the emulator boots, so a compile error fails here rather than inside the emulator step.
      - name: Build the app and test APKs
        run: ./gradlew assembleGithubDebug assembleGithubDebugAndroidTest

      - name: Restore AVD snapshot
        if: matrix.variant == 'snapshot'
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api25-android-tv-x86-v1

      - name: Create AVD and snapshot
        if: matrix.variant == 'snapshot' && steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          # No -no-snapshot: the emulator saves a snapshot on exit for the test step and the cache.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot"

      # A boot timeout or any failed test fails this step and the job.
      - name: Instrumented tests (API 25 Android TV)
        id: tests
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.EMULATOR_API_LEVEL }}
          target: ${{ env.EMULATOR_TARGET }}
          arch: ${{ env.EMULATOR_ARCH }}
          force-avd-creation: false
          emulator-options: ${{ matrix.variant == 'cold' && '-no-snapshot' || '-no-snapshot-save' }} -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedGithubDebugAndroidTest

      # Gradle's console output doesn't name the tests or show a failure's exception; the JUnit XML does.
      - name: Instrumented test results
        if: always() && steps.tests.outcome != 'skipped'
        run: |
          shopt -s globstar nullglob
          results=(app/build/outputs/androidTest-results/connected/**/TEST-*.xml)
          if [ "${#results[@]}" -eq 0 ]; then
            echo "No instrumented test results."
            exit 0
          fi
          for f in "${results[@]}"; do
            echo "::group::$f"
            grep -oE '<testsuite [^>]*>' "$f"
            grep -oE '<testcase name="[^"]*"' "$f"
            grep -A5 '<failure' "$f" || true
            echo "::endgroup::"
          done
