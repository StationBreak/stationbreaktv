name: CI

# Never pull_request_target: fork PRs must not get secrets or a write token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # The head repo is part of the key, so a fork branch with the same name can't cancel our runs.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default "enhanced" provider is proprietary; "basic" wraps actions/cache.
          cache-provider: basic
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and assemble
        run: >-
          ./gradlew check
          assembleAmazonDebug assembleAmazonRelease
          assembleGithubDebug assembleGithubRelease
          --continue

      - name: Name the debug APK
        id: apk
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          shortsha="${HEAD_SHA::7}"
          if [ "$EVENT_NAME" = pull_request ]; then
            name="stationbreak-github-debug-pr${PR_NUMBER}-${shortsha}.apk"
          else
            name="stationbreak-github-debug-main-${shortsha}.apk"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/github/debug/app-github-debug.apk "dist/${name}"
          echo "path=dist/${name}" >> "$GITHUB_OUTPUT"

      - name: Inspect APKs
        env:
          # AGP 9.4's default build-tools version.
          BUILD_TOOLS_VERSION: 36.0.0
          DEBUG_APK: ${{ steps.apk.outputs.path }}
          RELEASE_APK: app/build/outputs/apk/github/release/app-github-release-unsigned.apk
          AMAZON_RELEASE_APK: app/build/outputs/apk/amazon/release/app-amazon-release-unsigned.apk
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          echo "::group::apksigner verify --print-certs (github debug)"
          "$BUILD_TOOLS/apksigner" verify --print-certs "$DEBUG_APK"
          echo "::endgroup::"
          echo "::group::aapt2 dump badging (github debug)"
          "$BUILD_TOOLS/aapt2" dump badging "$DEBUG_APK" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)"
          echo "::endgroup::"
          echo "::group::aapt2 dump badging (github release)"
          "$BUILD_TOOLS/aapt2" dump badging "$RELEASE_APK" | grep -E "^(package|minSdkVersion|sdkVersion|targetSdkVersion|application-debuggable)"
          echo "::endgroup::"
          # ADR-0011 condition 3: a release build is never debuggable. Fail the job if either flavor's is.
          for apk in "$RELEASE_APK" "$AMAZON_RELEASE_APK"; do
            # Assign first so a missing APK or an aapt2 error fails the step instead of passing the grep.
            badging="$("$BUILD_TOOLS/aapt2" dump badging "$apk")"
            if grep -q "^application-debuggable" <<<"$badging"; then
              echo "::error::release APK is debuggable (ADR-0011): $apk"
              exit 1
            fi
            echo "release APK not debuggable: $apk"
          done

      # Same-repo PRs only: fork PRs build and test but never get an APK (ADR-0011).
      - name: Upload PR debug APK
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          retention-days: 7
          if-no-files-found: error

      - name: Upload main debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
