name: CI

# Never pull_request_target: fork PRs must not get secrets or a write token.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      # Also validates the Gradle wrapper jar.
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          # The default "enhanced" provider is proprietary; "basic" wraps actions/cache.
          cache-provider: basic
          # Only main writes the cache; PRs read it.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check and assemble
        run: >-
          ./gradlew check
          assembleAmazonDebug assembleAmazonRelease
          assembleGithubDebug assembleGithubRelease
          --continue
