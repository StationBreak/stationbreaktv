# detekt settings for [KMP] modules, on top of detekt's defaults (buildUponDefaultConfig).
style:
  ForbiddenImport:
    active: true
    # java.* in commonMain is rejected by the linuxX64 canary's compiler (proven by a failing PR in F0.2, so the
    # java.*/javax.* backstop was reduced to this, per ADR-0004). javax.inject is JVM-only and would still compile
    # for jvm, so it's caught here.
    forbiddenImports:
      - value: 'javax.inject.*'
        reason: 'Keep the shared core KMP-ready (MODULES.md, "Hilt in pure modules"); wire it with @Provides in app.'
