[versions]
# Kotlin 2.4.20 or later is required by jellyfin-sdk-kotlin 1.9.2 (F0.3). AGP 9 has Kotlin built in;
# declaring the Kotlin plugin in the root build raises AGP's bundled Kotlin to this version.
kotlin = "2.4.21"
agp = "9.4.1"
# detekt 2.0.0-alpha.6 is the only release built for Kotlin 2.4; move to 2.0 stable when it ships.
detekt = "2.0.0-alpha.6"
spotless = "8.10.4"
# Pinned so formatting only changes when this line does, not with Spotless's bundled default (#161).
ktlint = "1.8.0"
licensee = "1.14.1"
desugarJdkLibs = "2.1.5"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose BOM 2026.09.00 = Compose 1.12.1 (checked 2026-10-13).
composeBom = "2026.09.00"
# tv-material 1.1.0 stable (2026-05-06); minSdk 23, so fine on API 25.
tvMaterial = "1.1.0"
activityCompose = "1.13.0"
# Navigation 2.10.2 is the latest stable (checked 2026-10-14); typed routes need the kotlinx-serialization plugin in `app`.
navigation = "2.10.2"
# Lifecycle 2.11.0 is the latest stable (2.12 is still alpha, checked 2026-10-14): ViewModels and lifecycle-aware collection.
lifecycle = "2.11.0"
# hilt-navigation-compose 1.4.0 is the latest stable (checked 2026-10-14): hiltViewModel() for @HiltViewModel.
hiltNavigationCompose = "1.4.0"

# jellyfin-sdk-kotlin 1.9.2 (checked 2026-10-13): the 12.0+ line, the version ADR-0006 tested. Upgrade only through the
# contract matrix (F0.3 Unit 3).
jellyfinSdk = "1.9.2"
# OkHttp and kotlinx-coroutines are pinned to the versions the SDK 1.9.2 POM resolves (ADR-0006): move them only
# together with the SDK.
okhttp = "5.5.0"
coroutines = "1.11.0"
# kotlinx-serialization 1.11.0 is the latest stable (checked 2026-10-13; 1.12.0 is still an RC). Its compiler plugin
# is the Kotlin version.
serialization = "1.11.0"
# slf4j-nop 2.0.18 is the SLF4J line the SDK's kotlin-logging resolves (slf4j-api 2.0.18, checked 2026-10-14): without a
# binding the SDK's first request crashes on Android (ADR-0006, F0.3 task 2.13).
slf4j = "2.0.18"

# Hilt 2.60.1 and KSP 2.3.12 build and run with AGP 9.4.1 and Kotlin 2.4.21 (spiked 2026-10-14, F0.3 task 3.1). KSP,
# not kapt: AGP 9's built-in Kotlin doesn't support kapt. Hilt is for `app` only (MODULES.md, "Hilt in pure modules").
hilt = "2.60.1"
ksp = "2.3.12"
# Test only, for the container contract suite (`contractTest`). 2.0.5 is the latest stable (checked 2026-10-14); the
# 2.x line works with current Docker engines. Core module only: the suite manages its containers itself.
testcontainers = "2.0.5"
# Test only, `core:rules` jvmTest: validates the rules-format examples against the JSON Schema 2020-12 file (spec 07).
# 3.0.8 is the latest stable (checked 2026-10-15; the jar was published 2026-09-30). Apache-2.0. Never in a runtime classpath.
jsonSchemaValidator = "3.0.8"

# Room 2.8.5 is the latest stable Room 2 (checked 2026-10-15; released 2026-09-09): the library cache in data:library only
# (core:* may not declare it, checkArchitecture). minSdk 23, fine on API 25. Room 3.0.3 (androidx.room3, also minSdk 23) is
# not used: see the spec 06 task 2.2 verdict in docs/MODULES.md. KSP only, no kapt.
room = "2.8.5"
# androidx.sqlite 2.7.1 (checked 2026-10-15) is Room 2.8.5's own SQLite line. Its bundled driver is TEST ONLY: it lets the
# cache's unit tests run Room on the JVM. The app uses the platform SQLite.
androidxSqlite = "2.7.1"

minSdk = "25"
# Compose 1.12 requires compileSdk 37 (its AARs set minCompileSdk=37). minSdk and targetSdk are unchanged
# (owner, 2026-10-12/13).
compileSdk = "37"
# targetSdk = the current Google Play target API level requirement for Android TV apps (Amazon follows Play):
# "Android TV ... apps ... must target Android 14 (API level 34) or higher".
# Source: https://support.google.com/googleplay/android-developer/answer/11926878 (checked 2026-10-11)
targetSdk = "34"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
# Versioned by the Compose BOM.
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
# Debug only: registers the empty ComponentActivity that Compose UI tests of a library module launch.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
# The annotation processor, through KSP (`ksp(...)`) in data:library only.
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Test only: the JVM build of the bundled SQLite driver (it carries the Linux x64 native library) that the cache's unit tests
# run Room on (see [versions]). The Android build of this artifact has no host library. Never in an APK.
androidx-sqlite-bundled-jvm = { module = "androidx.sqlite:sqlite-bundled-jvm", version.ref = "androidxSqlite" }

jellyfin-sdk-core = { module = "org.jellyfin.sdk:jellyfin-core", version.ref = "jellyfinSdk" }
jellyfin-sdk-api-okhttp = { module = "org.jellyfin.sdk:jellyfin-api-okhttp", version.ref = "jellyfinSdk" }
# Pinned to the SDK's version (see [versions]).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Pinned to the SDK's version (see [versions]).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Test only. Same version as kotlinx-coroutines-core: virtual time for the Quick Connect polling tests.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# No-op SLF4J binding for `app`, until S3.6.1 builds the redacting logger (ADR-0006).
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# javax.inject 1 is the only release; it is the JSR-330 annotations and nothing else (MODULES.md, "Hilt in pure modules").
javax-inject = { module = "javax.inject:javax.inject", version = "1" }
# Test only. Same line as okhttp, so the TLS and mock-server helpers match the client under test.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { module = "com.google.dagger:hilt-android-testing", version.ref = "hilt" }

testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
# Test only (see [versions]).
json-schema-validator = { module = "com.networknt:json-schema-validator", version.ref = "jsonSchemaValidator" }
# Test only. Pins the validator's Jackson 3 tree to 3.2.3, which fixes the advisories in 3.2.1 (checked 2026-10-16).
jackson-bom = { module = "tools.jackson:jackson-bom", version = "3.2.3" }

# Gradle plugins, as libraries: build-logic compiles its convention plugins against these.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
licensee-gradlePlugin = { module = "app.cash.licensee:licensee-gradle-plugin", version.ref = "licensee" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
