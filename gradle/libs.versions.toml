[versions]
# Kotlin 2.4.20 or later is required by jellyfin-sdk-kotlin 1.9.2 (F0.3). AGP 9 has Kotlin built in;
# declaring the Kotlin plugin in the root build raises AGP's bundled Kotlin to this version.
kotlin = "2.4.21"
agp = "9.4.1"
# detekt 2.0.0-alpha.6 is the only release built for Kotlin 2.4; move to 2.0 stable when it ships.
detekt = "2.0.0-alpha.6"
spotless = "8.10.4"
# Pinned so formatting only changes when this line does, not with Spotless's bundled default (#161).
ktlint = "1.8.0"
licensee = "1.14.1"
desugarJdkLibs = "2.1.5"
junit = "4.13.2"
androidxTestCore = "1.7.0"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# Compose BOM 2026.09.00 = Compose 1.12.1 (checked 2026-10-13).
composeBom = "2026.09.00"
# tv-material 1.1.0 stable (2026-05-06); minSdk 23, so fine on API 25.
tvMaterial = "1.1.0"
activityCompose = "1.13.0"

# jellyfin-sdk-kotlin 1.9.2 (checked 2026-10-13): the 12.0+ line, the version ADR-0006 tested. Upgrade only through the
# contract matrix (F0.3 Unit 3).
jellyfinSdk = "1.9.2"
# OkHttp and kotlinx-coroutines are pinned to the versions the SDK 1.9.2 POM resolves (ADR-0006): move them only
# together with the SDK.
okhttp = "5.5.0"
coroutines = "1.11.0"
# kotlinx-serialization 1.11.0 is the latest stable (checked 2026-10-13; 1.12.0 is still an RC). Its compiler plugin
# is the Kotlin version.
serialization = "1.11.0"
# slf4j-nop 2.0.18 is the SLF4J line the SDK's kotlin-logging resolves (slf4j-api 2.0.18, checked 2026-10-14): without a
# binding the SDK's first request crashes on Android (ADR-0006, F0.3 task 2.13).
slf4j = "2.0.18"

minSdk = "25"
# Compose 1.12 requires compileSdk 37 (its AARs set minCompileSdk=37). minSdk and targetSdk are unchanged
# (owner, 2026-10-12/13).
compileSdk = "37"
# targetSdk = the current Google Play target API level requirement for Android TV apps (Amazon follows Play):
# "Android TV ... apps ... must target Android 14 (API level 34) or higher".
# Source: https://support.google.com/googleplay/android-developer/answer/11926878 (checked 2026-10-11)
targetSdk = "34"

[libraries]
desugar-jdk-libs = { module = "com.android.tools:desugar_jdk_libs", version.ref = "desugarJdkLibs" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
# Versioned by the Compose BOM.
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }

jellyfin-sdk-core = { module = "org.jellyfin.sdk:jellyfin-core", version.ref = "jellyfinSdk" }
jellyfin-sdk-api-okhttp = { module = "org.jellyfin.sdk:jellyfin-api-okhttp", version.ref = "jellyfinSdk" }
# Pinned to the SDK's version (see [versions]).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# Pinned to the SDK's version (see [versions]).
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
# Test only. Same version as kotlinx-coroutines-core: virtual time for the Quick Connect polling tests.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
# No-op SLF4J binding for `app`, until S3.6.1 builds the redacting logger (ADR-0006).
slf4j-nop = { module = "org.slf4j:slf4j-nop", version.ref = "slf4j" }
# javax.inject 1 is the only release; it is the JSR-330 annotations and nothing else (MODULES.md, "Hilt in pure modules").
javax-inject = { module = "javax.inject:javax.inject", version = "1" }
# Test only. Same line as okhttp, so the TLS and mock-server helpers match the client under test.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }

# Gradle plugins, as libraries: build-logic compiles its convention plugins against these.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
licensee-gradlePlugin = { module = "app.cash.licensee:licensee-gradle-plugin", version.ref = "licensee" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
