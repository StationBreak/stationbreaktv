org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# Independent modules build at the same time; without it, CI's build job ran its ~1,000 tasks one at a time.
org.gradle.parallel=true
# Reuse task outputs whose inputs haven't changed: locally across branches, and in CI from main's last build.
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
